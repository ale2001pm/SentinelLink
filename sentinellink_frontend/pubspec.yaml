name: sentinellink_frontend
description: SentinelLink - Internal Communication App (Desktop + Mobile)

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebSocket communication
  web_socket_channel: ^2.4.0

  # State management
  provider: ^6.0.0

  # HTTP client (for future API calls)
  http: ^1.1.0

  # File picker for image sending
  file_picker: ^6.1.1

  # Charts for system monitor
  fl_chart: ^0.68.0

  # JSON serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
